services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: go_web_template
            MYSQL_USER: app
            MYSQL_PASSWORD: app_password
        ports:
            - "127.0.0.1:3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:7.4
        ports:
            - "127.0.0.1:6379:6379"

volumes:
    mysql_data:
