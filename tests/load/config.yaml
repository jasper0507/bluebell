# 仅用于本机压测。复用已有独立库，不能指向业务库 bluebell。
http:
    addr: "127.0.0.1:18080"
    shutdown_timeout: 5s
mysql:
    host: 127.0.0.1
    port: 3306
    username: loadtest
    password: loadtest_local_only
    database: bluebell_k6_verify
    max_open_conns: 10
    max_idle_conns: 10
    conn_max_lifetime: 3m
redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 13
log:
    level: info
    format: json
auth:
    secret: "bluebell-local-loadtest-secret-32bytes"
    issuer: bluebell-loadtest
    access_token_ttl: 15m
    refresh_token_ttl: 168h
    cookie_secure: false
