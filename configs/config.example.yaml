http:
    addr: ":8080"
    shutdown_timeout: 5s

mysql:
    host: 127.0.0.1
    port: 3306
    username: app
    password: app_password
    database: bluebell
    max_open_conns: 10
    max_idle_conns: 10
    conn_max_lifetime: 3m

redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0

log:
    level: info
    format: text

jwt:
    secret: "replace-with-at-least-32-byte-secret"
    issuer: bluebell
    access_token_ttl: 30m
